name: repository integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r environments/requirements.txt
      - name: Verify tracked release artifacts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_release_schema.py
          tests/test_text_style.py
          tests/test_cell_systems_freeze.py
          tests/test_independent_confirmation_decisions.py
          tests/test_natural_genetics_audit.py
          tests/test_strict_liftover.py
          tests/test_genetic_confirmation_runner.py
