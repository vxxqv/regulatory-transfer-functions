name: repository integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r environments/requirements.txt
      - name: Verify tracked release artifacts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_release_schema.py
          tests/test_text_style.py
          tests/test_cell_systems_freeze.py
          tests/test_independent_confirmation_decisions.py
          tests/test_natural_genetics_audit.py
          tests/test_strict_liftover.py
          tests/test_genetic_confirmation_runner.py
          tests/test_transfer_stability.py
          tests/test_buffering_deletions.py
          tests/test_composition_sensitivity.py
          tests/test_grn_paired_contrasts.py
          tests/test_disease_model_uncertainty.py
          tests/test_strengthening_synthesis.py
          tests/test_bibliography.py
