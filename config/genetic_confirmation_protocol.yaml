locus_derivation:
  timing: after_each_schema_eligible_GWAS_is_opened
  genome_wide_significance_p_below: 5.0e-8
  clumping_r2: 0.1
  clumping_window_kb: 1000
  primary_boundary: LD_block
  sensitivity_boundary_kb: 500
  matched_negative_locus_timing: after_index_locus_derivation
  matched_negative_locus_inputs: frozen_covariates_and_calipers_only
  outcome_magnitude_or_rank_used_for_matching: false

post_opening_schema:
  required_fields: [chromosome, base_pair_location, effect_allele, other_allele, standard_error, p_value, sample_size, effect_allele_frequency_or_minor_allele_frequency]
  effect_field: exactly_one_of_beta_or_odds_ratio
  imputed_variant_field: info_required
  allele_rule: uppercase_biallelic_ACGT
  odds_ratio_rule: positive_then_natural_log
  standard_error_rule: finite_and_above_zero
  p_value_rule: finite_above_zero_and_at_most_one
  sample_size_rule: per_variant_or_locked_study_sample_size_above_zero
  frequency_rule: minor_allele_frequency_above_zero_and_at_most_0.5
  imputation_quality_minimum: 0.80
  ambiguous_palindrome_rule: reject_if_minor_allele_frequency_above_0.42
  duplicate_variant_key_maximum_fraction: 0.001
  maximum_unresolved_effect_direction_fraction: 0.05
  minimum_expected_dense_variant_coverage_fraction: 0.90
  candidate_stop_rules: [missing_required_field, truncated_file, missing_chromosome, duplicate_fraction_exceeded, unresolved_direction_fraction_exceeded, dense_coverage_failed, checksum_failed]
  locus_minimum_shared_variants: 100
  locus_minimum_shared_coverage_fraction: 0.80
  locus_stop_rules: [incomplete_GWAS_coverage, incomplete_eQTL_coverage, incomplete_LD_coverage, allele_harmonization_failed]
  substitutions_allowed: false

analysis_order:
  steps:
    - verify_frozen_CD4_program_annotation_paths_hashes_and_manifest
    - verify_download_checksums_and_immutable_roles
    - execute_negative_diseases_through_complete_pipeline
    - define_MHC_excluded_GWAS_loci
    - derive_matched_negative_loci_with_frozen_covariates_and_calipers
    - competitive_gene_set_enrichment
    - stratified_LD_score_regression
    - locus_fine_mapping
    - GWAS_cis_eQTL_colocalization
    - chromatin_enhancer_and_perturbation_convergence
    - causal_instrument_gates
    - mediation_only_for_passed_gates
    - MHC_included_sensitivity
    - matched_negative_controls_and_rewiring
    - multiplicity_correction
    - complete_denominator_and_decision
  alternatives_after_outcome_inspection_allowed: false

methods:
  competitive_enrichment:
    engine: MAGMA_v1.10
    gene_window: {upstream_bp: 10000, downstream_bp: 10000}
    model: competitive_gene_set
    primary_tail: one_sided_positive
    report_two_sided: true
    covariates: [gene_size, snp_density, gene_expression, expression_specificity, local_ld_score, response_degree, network_degree]
  partitioned_heritability:
    engine: LDSC_v1.0.1
    model: stratified_LD_score_regression
    primary: MHC_excluded
    sensitivity: MHC_included
    custom_annotations: [state_matched_ATAC, state_matched_H3K27ac, direct_program, secondary_program, buffered_program, rerouted_program, conserved_core_program]
    baseline: baseline-LD_v2.2
    munging: {info_minimum: 0.90, maf_minimum: 0.01, SNPs: HapMap3_no_MHC}
  fine_mapping:
    engine: susieR_v0.14.2
    method: susie_rss
    credible_set_coverage: 0.95
    maximum_effects: 10
    estimate_residual_variance: false
    LD_reference: 1000G_NYGC_3202_unrelated_EUR_GRCh38
    require_LD_consistency_diagnostic: true
  colocalization:
    engine: coloc_v6.0.1
    method: coloc_susie
    priors: {p1: 0.0001, p2: 0.0001, p12: 0.00001}
    minimum_PP4: 0.80
    minimum_PP4_to_PP3_ratio: 3.0
    approximate_Bayes_factor_fallback_allowed: false
  mhc:
    primary: excluded
    sensitivity: included
    GRCh38: {chromosome: 6, start: 25000000, end: 34000000}
  multiple_testing:
    method: Benjamini_Hochberg
    alpha: 0.05
    families: [competitive_enrichment, partitioned_heritability, colocalization, causal_tests, mediation, negative_controls]
  causal_gates:
    minimum_instrument_F: 10
    minimum_colocalization_PP4: 0.80
    minimum_PP4_to_PP3_ratio: 3.0
    steiger_direction_required: true
    cochran_Q_p_minimum: 0.05
    egger_intercept_p_minimum: 0.05
    leave_one_instrument_direction_stable: true
    alternate_gene_test_required: true
    matched_negative_locus_test_required: true
    mediation_claim_if_any_gate_fails: false

