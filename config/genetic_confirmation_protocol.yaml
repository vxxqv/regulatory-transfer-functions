negative_disease_selection:
  provider: EMBL-EBI_GWAS_Catalog
  source_publication_pmid: 39024449
  population: European_United_States_MVP
  effective_n_formula: 4/(1/cases+1/controls)
  positive_effective_n_range: [10980.26, 97623.66]
  allowed_range_ratio: [0.90, 1.20]
  allowed_effective_n_range: [9882.23, 117148.39]
  direct_phenotype_required: true
  dense_full_statistics_required: true
  required_format: GWAS-SSF_v1.0_gzip_TSV
  required_variant_scale: 44.3_million_imputed_variants
  prohibited_phenotypes: [family_history, biomarker, medication_use, symptom_only, broad_proxy, autoimmune, infectious, neoplastic]
  fixed_families:
    - family: structural_hernia
      anchor: maximum_positive_effective_n
      candidates: [GCST90476059, GCST90476060, GCST90476062, GCST90476063]
      selected: GCST90476060
    - family: gastric_motility
      anchor: minimum_positive_effective_n
      candidates: [GCST90478363]
      selected: GCST90478363
  ranking: absolute_natural_log_ratio_to_family_anchor_ascending
  tie_break: accession_ascending
  replacements_after_outcome_opening_allowed: false
  interpretation: disease_specificity_falsification_not_proof_of_absent_immune_biology
  comorbidity_rule: any_enrichment_in_a_selected_control_fails_the_specificity_gate_and_is_reported_without_replacement
  locked_disease_continuation_rule: every_schema_eligible_locked_disease_is_analyzed_and_reported_regardless_of_earlier_negative_control_results
  negative_control_outcome_can_stop_later_disease_opening: false
  disease_pipeline_stop_causes: [checksum_failure, schema_failure, unavailable_locked_resource]

