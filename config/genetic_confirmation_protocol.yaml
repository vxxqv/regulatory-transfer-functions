negative_region_matching:
  candidate_pool: nonoverlapping_windows_tiled_before_association_statistics_are_joined
  controls_per_locus: 10
  minimum_controls_for_estimable_locus: 5
  exact_match: [chromosome]
  exclude_mhc: true
  exclude_blacklist_overlap: true
  minimum_distance_from_any_index_locus_bp: 2000000
  matching_without_replacement_within_disease: true
  reuse_across_diseases: false
  distance: standardized_manhattan
  tie_break: [chromosome_ascending, start_ascending]
  no_caliper_expansion: true
  variables:
    maf: {caliper: absolute_difference, maximum: 0.02, source: 1000G_EUR}
    locus_size: {caliper: ratio, minimum: 0.80, maximum: 1.25, unit: bp}
    ld_score: {caliper: ratio, minimum: 0.80, maximum: 1.25, source: baseline-LD_v2.2}
    gene_density: {caliper: absolute_difference, maximum: 2.0, unit: genes_per_Mb}
    distance_to_tss: {caliper: absolute_log10_difference, maximum: 0.25, transform: log10_bp_plus_1}
    accessibility: {caliper: absolute_difference, maximum: 0.05, unit: accessible_fraction}
    mappability: {caliper: absolute_difference, maximum: 0.05, source: Umap_100bp, unit: mean_fraction}
  association_values_forbidden_in_matching: true
  significance_values_forbidden_in_matching: true

liftover:
  assay: GSE118189_ATAC
  source_build: hg19
  target_build: GRCh38
  input_coordinates: BED_0_based_half_open
  forward_chain:
    file: hg19ToHg38.over.chain.gz
    url: https://hgdownload.soe.ucsc.edu/goldenPath/hg19/liftOver/hg19ToHg38.over.chain.gz
    md5: 35887f73fe5e2231656504d1f6430900
  reciprocal_chain:
    file: hg38ToHg19.over.chain.gz
    url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/liftOver/hg38ToHg19.over.chain.gz
    md5: ff3031d93792f4cbb86af44055efd903
  primary:
    min_match: 0.95
    minimum_length_retention: 0.95
    minimum_reciprocal_overlap_fraction: 0.95
  sensitivity:
    min_match: 0.99
    minimum_length_retention: 0.99
    minimum_reciprocal_overlap_fraction: 0.99
  multiple_mapping: reject
  split_mapping: reject
  chromosome_change: reject
  accepted_chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX]
  source_blacklist_before_mapping: true
  target_blacklist_after_mapping: true
  blacklist_release_commit: 61a04d2c5e49341d76735d485c61f0d1177d08a8
  denominators: [input_intervals, input_bp, source_blacklisted, unmapped, split_or_multimapped, chromosome_changed, length_failed, reciprocal_failed, target_blacklisted, accepted_intervals, accepted_bp]
  substitutions_allowed: false

checksums:
  provider_checksum_required_when_available: true
  provider_checksum_must_verify: true
  local_sha256_required_for_every_file: true
  local_sha256_scope: exact_downloaded_bytes
  record: [source_url, file_name, expected_bytes, observed_bytes, provider_algorithm, provider_checksum, provider_verification, local_sha256, downloaded_utc]
  checksum_manifest_sha256_required: true
  mismatch_action: stop_file_and_dependent_branch
  redownload_attempts: 1
  substitutions_allowed: false

